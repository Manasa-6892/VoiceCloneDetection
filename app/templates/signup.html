<!DOCTYPE html>
<html>
<head>
  <title>Sign Up - Voice Clone Detection</title>
  <meta charset="utf-8">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e6f0ff, #f4f7fb);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      width: 380px;
      padding: 35px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    /* LOGO */
    .logo {
      font-size: 28px;
      margin-bottom: 5px;
    }

    h2 {
      margin: 0;
      color: #1e40af;
      font-weight: 600;
    }

    .subtitle {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 25px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 18px;
      position: relative;
    }

    label {
      font-size: 13px;
      color: #334155;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 5px rgba(37,99,235,0.2);
    }

    .show-pass {
      position: absolute;
      right: 10px;
      top: 33px;
      cursor: pointer;
      font-size: 14px;
      color: #64748b;
    }

    .error {
      font-size: 12px;
      color: #ef4444;
      display: none;
      margin-top: 4px;
    }

    button {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 15px;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .footer {
      margin-top: 15px;
      font-size: 13px;
    }

    .footer a {
      color: #2563eb;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .errors {
      margin-top: 10px;
      color: #ef4444;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="auth-card">

  <!-- LOGO -->
  <div class="logo">🎤</div>

  <h2>Voice Clone Detection</h2>
  <div class="subtitle">Create your account</div>

  <form method="POST">

    <!-- USERNAME -->
    <div class="input-group">
      <label>Username</label>
      <input type="text" name="username" id="username" required minlength="3">
      <div class="error">Username is required</div>
    </div>

    <!-- PASSWORD -->
    <div class="input-group">
      <label>Password</label>
      <input type="password" name="password" id="password" required minlength="6">
      <span class="show-pass" onclick="togglePassword()"></span>
      <div class="error">Password must be at least 6 characters</div>
    </div>

    <button type="submit">Sign Up</button>
  </form>

  <div class="footer">
    Already have an account? <a href="{{ url_for('login') }}">Login</a>
  </div>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="errors">
        {% for m in messages %}
          <div>{{ m }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

</div>

<script>
function togglePassword() {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

// validation (touched)
document.querySelectorAll("input").forEach(input => {
  input.addEventListener("blur", function () {
    const error = this.parentElement.querySelector(".error");

    if (!this.value.trim()) {
      this.style.border = "1px solid #ef4444";
      error.style.display = "block";
    } else if (this.name === "password" && this.value.length < 6) {
      this.style.border = "1px solid #ef4444";
      error.style.display = "block";
    } else {
      this.style.border = "1px solid #22c55e";
      error.style.display = "none";
    }
  });
});
</script>

</body>
</html>
